<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커플 테이블톡 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #fef5f5 0%, #fce4ec 50%, #fecdd2 100%);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .heart-icon {
            width: 40px;
            height: 40px;
            color: #ec4899;
            fill: #ec4899;
            margin: 0 auto 12px;
            display: block;
        }

        h1 {
            font-size: 36px;
            color: #1f2937;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: #6b7280;
            font-size: 16px;
        }

        .question-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 48px 32px;
            margin-bottom: 24px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 4px solid #fbcfe8;
        }

        .question-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
            background: #fce7f3;
            color: #be185d;
        }

        .question-text {
            font-size: 28px;
            font-weight: 500;
            color: #1f2937;
            line-height: 1.5;
            text-align: center;
        }

        .next-button {
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            font-weight: 700;
            color: white;
            font-size: 18px;
            background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .next-button:hover {
            background: linear-gradient(135deg, #db2777 0%, #e11d48 100%);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .next-button:active {
            transform: translateY(0);
        }

        .progress-info {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #6b7280;
        }

        .tips-card {
            margin-top: 32px;
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .tips-title {
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }

        .sparkle-icon {
            width: 18px;
            height: 18px;
            color: #ec4899;
        }

        .tips-list {
            list-style: none;
        }

        .tips-list li {
            padding: 8px 0;
            font-size: 14px;
            color: #6b7280;
        }

        .love-note {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

        .icon {
            width: 24px;
            height: 24px;
            display: inline-block;
            vertical-align: middle;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }

            .question-text {
                font-size: 22px;
            }

            .question-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <svg class="heart-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <h1>커플 테이블톡</h1>
            <p class="subtitle">우리를 더 깊이 알아가는 시간</p>
        </div>

        <!-- Question Card -->
        <div class="question-card">
            <div style="text-align: center;">
                <span class="question-badge" id="questionBadge">질문 1 / 60</span>
                <p class="question-text" id="questionText">우리가 처음 만났을 때 첫인상은 어땠어?</p>
            </div>
        </div>

        <!-- Next Button -->
        <button class="next-button" onclick="getRandomQuestion()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
            다음 질문
        </button>

        <!-- Progress Info -->
        <div class="progress-info" id="progressInfo"></div>

        <!-- Tips Card -->
        <div class="tips-card">
            <h3 class="tips-title">
                <svg class="sparkle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
                </svg>
                사용 팁
            </h3>
            <ul class="tips-list">
                <li>• 서두르지 말고 천천히 대화를 나눠보세요</li>
                <li>• 정답은 없어요. 솔직한 마음을 나누는 시간입니다</li>
                <li>• 상대방의 답변을 경청하고 공감해주세요</li>
                <li>• 질문에서 새로운 대화가 시작될 수 있어요</li>
                <li>• 서로의 이야기를 들으며 더 가까워져보세요</li>
            </ul>
        </div>

        <!-- Love Note -->
        <div class="love-note">
            <p>❤️ 소중한 사람과의 특별한 시간을 응원합니다 ❤️</p>
        </div>
    </div>

    <script>
        const questions = [
            // 기존 질문들
            "우리가 처음 만났을 때 첫인상은 어땠어?",
            "내가 가장 매력적으로 느껴질 때는 언제야?",
            "우리 관계에서 가장 소중하게 생각하는 순간은?",
            "10년 후 우리는 어떤 모습일 것 같아?",
            "내가 몰랐으면 하는 너의 비밀이 있어?",
            "나한테 고마웠지만 말하지 못했던 순간이 있어?",
            "우리가 함께 꼭 가보고 싶은 여행지는?",
            "내가 더 잘해줬으면 하는 게 있어?",
            "우리 관계에서 가장 웃겼던 에피소드는?",
            "만약 하루 동안 역할을 바꾼다면 뭘 해보고 싶어?",
            "내가 힘들 때 가장 위로가 되는 말이나 행동은?",
            "우리가 함께 새롭게 도전해보고 싶은 취미는?",
            "나를 한 단어로 표현한다면?",
            "우리의 다음 기념일에는 뭘 하고 싶어?",
            "내가 모르는 너의 특별한 재능이 있어?",
            "우리가 함께 이루고 싶은 목표는?",
            "내 어떤 모습이 가장 사랑스러워?",
            "만약 과거로 돌아간다면 우리의 첫 만남에서 뭘 다르게 하고 싶어?",
            "우리 둘만의 특별한 전통을 만든다면?",
            "내가 너에게 배우고 싶은 점은?",
            "우리가 함께 늙어가는 모습을 상상할 때 어떤 생각이 들어?",
            "너의 꿈을 이루기 위해 내가 도와줄 수 있는 건?",
            "우리 관계가 더 좋아지려면 뭐가 필요할까?",
            "내가 힘들어할 때 알아채는 방법이 있어?",
            "우리가 함께한 순간 중 가장 행복했던 때는?",
            "만약 우리가 함께 사업을 한다면 뭘 하고 싶어?",
            "나에 대해 더 알고 싶은 게 있어?",
            "우리의 관계를 색깔로 표현한다면?",
            "내가 너를 자랑스럽게 만든 순간이 있어?",
            "50년 후에도 함께 하고 싶은 우리만의 습관은?",
            
            // 새로운 질문들
            "내가 너를 가장 많이 생각하는 순간은 언제일 것 같아?",
            "나랑 있을 때 가장 편안함을 느끼는 순간은?",
            "우리가 말없이 함께 있어도 행복한 이유가 뭘까?",
            "내가 너에게 가장 큰 영향을 준 부분이 있다면?",
            "우리 관계를 시작하면서 내가 어떻게 변했다고 생각해?",
            "우리가 함께 보낸 평범한 하루 중 기억에 남는 날은?",
            "내가 좋아하는 음식을 평생 못 먹게 된다면 어떤 음식으로 대신 해줄래?",
            "우리 둘이 함께 보고 싶은 영화나 드라마 장르는?",
            "나랑 데이트할 때 가장 설레는 순간은?",
            "우리가 함께 만들고 싶은 크리스마스 추억은?",
            "우리가 함께 살 집은 어떤 분위기였으면 좋겠어?",
            "부모님이 되었을 때 어떤 부모가 되고 싶어?",
            "인생에서 가장 중요하게 생각하는 가치가 뭐야?",
            "5년 후 우리의 일상은 어떤 모습일까?",
            "우리가 함께 키우고 싶은 것은? (반려동물, 식물, 취미 등)",
            "우리가 의견이 다를 때 가장 좋은 해결 방법은 뭘까?",
            "내가 너의 기분을 더 잘 알아차리려면 어떻게 해야 할까?",
            "너는 사랑을 어떤 방식으로 표현받을 때 가장 좋아?",
            "우리가 힘든 시기를 함께 겪는다면 서로에게 어떤 사람이 되어주고 싶어?",
            "내가 너의 꿈을 응원하는 가장 좋은 방법은?",
            "만약 우리의 사랑을 노래로 만든다면 제목은?",
            "우리 커플만의 은어나 별명을 더 만든다면?",
            "타임캡슐에 우리의 추억 하나를 넣는다면?",
            "내 어린 시절 모습을 봤다면 어땠을 것 같아?",
            "우리가 처음으로 함께 요리해보고 싶은 메뉴는?",
            "만약 하루 동안 서로의 가족이 된다면 뭘 하고 싶어?",
            "우리의 1주년 기념일엔 어떤 이야기를 나누고 있을까?",
            "올해 우리가 함께한 순간 중 베스트 3는?",
            "내년에 우리가 꼭 함께 이루고 싶은 작은 목표는?",
            "지금 이 순간, 크리스마스에 나와 함께 있어서 어때?"
        ];

        let currentQuestion = 0;
        let usedQuestions = new Set();

        function updateDisplay() {
            document.getElementById('questionText').textContent = questions[currentQuestion];
            document.getElementById('questionBadge').textContent = `질문 ${currentQuestion + 1} / ${questions.length}`;
            
            if (usedQuestions.size > 0) {
                document.getElementById('progressInfo').textContent = 
                    `지금까지 ${usedQuestions.size}개의 질문을 나눴어요 💕`;
            }
        }

        function getRandomQuestion() {
            if (usedQuestions.size === questions.length) {
                usedQuestions.clear();
            }

            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * questions.length);
            } while (usedQuestions.has(newIndex) && usedQuestions.size < questions.length);

            usedQuestions.add(newIndex);
            currentQuestion = newIndex;
            updateDisplay();
        }

        // 초기 표시
        updateDisplay();
    </script>
</body>
</html>
